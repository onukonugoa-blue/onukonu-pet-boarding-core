<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full bleed background — maskable icons need padding inside a safe zone -->
  <rect width="512" height="512" fill="#1e3a5f"/>
  <!-- Top-left toe -->
  <ellipse cx="176" cy="214" rx="40" ry="49" fill="#ffffff" transform="rotate(-15 176 214)"/>
  <!-- Top-right toe -->
  <ellipse cx="336" cy="214" rx="40" ry="49" fill="#ffffff" transform="rotate(15 336 214)"/>
  <!-- Mid-left toe -->
  <ellipse cx="226" cy="180" rx="35" ry="44" fill="#ffffff" transform="rotate(-5 226 180)"/>
  <!-- Mid-right toe -->
  <ellipse cx="286" cy="180" rx="35" ry="44" fill="#ffffff" transform="rotate(5 286 180)"/>
  <!-- Central pad -->
  <ellipse cx="256" cy="328" rx="84" ry="68" fill="#ffffff"/>
</svg>
